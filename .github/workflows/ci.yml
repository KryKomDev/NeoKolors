name: CI & Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'Docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'Docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Restore Solution
        run: dotnet restore NeoKolors.slnx

      - name: Build Solution (Release)
        run: dotnet build NeoKolors.slnx -c Release --no-restore

      - name: Run Tests
        run: >-
          dotnet test NeoKolors.slnx
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results-${{ matrix.os }}.trx"
          --results-directory ./TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/*.trx
          if-no-files-found: ignore
