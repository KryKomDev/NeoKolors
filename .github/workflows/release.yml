name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v2026.3.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (do not publish to NuGet)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build-and-pack:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore Solution
        run: dotnet restore NeoKolors.slnx

      - name: Build Solution (Release)
        run: dotnet build NeoKolors.slnx -c Release --no-restore

      - name: Run Tests
        run: dotnet test NeoKolors.slnx -c Release --no-build

      - name: Pack Packages
        run: >-
          dotnet pack NeoKolors.slnx
          -c Release
          --no-build
          --output ./packages

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./packages/*.nupkg
            ./packages/*.snupkg

  github-release:
    name: Create GitHub Release
    needs: build-and-pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.release_tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" ./packages/* --generate-notes --title "Release $RELEASE_TAG"

  publish-nuget:
    name: Publish to NuGet
    needs: [build-and-pack, github-release]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' }}
    steps:
      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate


